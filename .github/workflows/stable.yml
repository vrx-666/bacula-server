name: Build and publish Bacula Server image

on:
  push:
    branches:
      - master
    # Don't rebuild+republish stable for changes that never affect the image
    # (CI workflows, gitignore, docs). A push is skipped only when ALL of its
    # changed files match these globs, so a Dockerfile/conf/VERSION change still
    # triggers a release.
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - 'README.md'

jobs:
  build:
    if: github.repository == 'vrx-666/bacula-server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GHCR
    strategy:
      fail-fast: false
      matrix:
        db: [postgresql, sqlite3]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history needed to count builds since VERSION changed

      - name: Compute version and build number
        id: ver
        env:
          DB: ${{ matrix.db }}
        run: .github/stable-tags.sh "$DB"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: pwa666
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.db }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            DB=${{ matrix.db }}
            BACULAV=${{ steps.ver.outputs.version }}
            PKG_REFRESH=${{ github.run_id }}
          tags: ${{ steps.ver.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.db }}
          cache-to: type=gha,mode=max,scope=${{ matrix.db }}
