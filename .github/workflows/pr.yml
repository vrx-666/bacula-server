name: PR build check

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    # Fork PRs are built too: Bacularis now installs from public sources (no
    # secrets), and this job is push:false with contents:read only - so there's
    # nothing to protect and validating external contributions is the point.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        db: [postgresql, sqlite3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Bacula version
        id: ver
        run: |
          SEED=$(tr -d '[:space:]' < VERSION)
          echo "version=${SEED%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without push (${{ matrix.db }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            DB=${{ matrix.db }}
            BACULAV=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.db }}
